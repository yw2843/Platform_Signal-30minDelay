name: Flight snapshot batch

on:
  schedule:
    - cron: "*/25 * * * *"
  workflow_dispatch: {}

concurrency:
  group: flight-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect a batch of flight-tracker snapshots
        working-directory: Flight_Data/realtime-flight-tracker
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python snapshot_batch.py

      - name: Commit and push the updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/flights-timeline.json
          if git diff --cached --quiet; then
            echo "No change in flights-timeline.json; skipping commit."
            exit 0
          fi

          # data/flights-timeline.json is a single machine-generated line
          # that this script always rewrites from scratch -- there is
          # nothing to merge between two versions of it, so rebasing onto a
          # newer origin (if another run's push landed during this run's
          # ~30-minute collection window) is guaranteed to hard-conflict on
          # that one line. Instead, just replay this run's commit on top of
          # whatever is currently on origin, retrying if the push itself
          # races against another concurrent push.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git commit -m "Update flight snapshot batch"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed (likely raced another push); retrying..."
            sleep 5
          done

          echo "::error::Failed to push the updated snapshot after 3 attempts."
          exit 1
