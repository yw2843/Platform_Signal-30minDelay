name: Flight snapshot batch

on:
  schedule:
    - cron: "*/25 * * * *"
  workflow_dispatch: {}

concurrency:
  group: flight-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect a batch of flight-tracker snapshots
        working-directory: Flight_Data/realtime-flight-tracker
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python snapshot_batch.py

      - name: Commit and push the updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/flights-timeline.json
          if git diff --cached --quiet; then
            echo "No change in flights-timeline.json; skipping commit."
            exit 0
          fi
          git commit -m "Update flight snapshot batch"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
